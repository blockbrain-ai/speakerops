# SpeakerOps API Worker — sections 1.2 (health) + 8.6 (dogfood deploy / S-CF)
# Binding names only. Secrets go in .dev.vars (gitignored) or `wrangler secret put`.
# Never commit tokens, API keys, or account credentials here (E10).
# Deploy: scripts/deploy-dogfood.sh · runbook: docs/OPERATIONS.md

name = "speakerops-api"
main = "apps/api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret public config (names + public version only)
# Production secrets (TURNSTILE_SECRET_KEY, RESEND_API_KEY, ACCELEVENTS_API_KEY, …) → wrangler secret put
[vars]
APP_VERSION = "0.1.0"
# Optional public Turnstile site key may be set at deploy time (not a private secret).
# TURNSTILE_SITE_KEY = ""  # set via dashboard / deploy pipeline — do not commit real keys

# D1 — binding name MUST be DB (AC: wrangler.toml lists D1 database binding name DB)
# database_id is a resource placeholder, not a secret; replace at deploy time via
# SPEAKEROPS_D1_DATABASE_ID (deploy-dogfood.sh) or local non-committed override.
# migrations_dir: same SQL as pnpm db:migrate (section 1.3 baseline + additive later).
[[d1_databases]]
binding = "DB"
database_name = "speakerops"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

# R2 — binding name FILES (logo / headshot / slides bytes; metadata in D1)
[[r2_buckets]]
binding = "FILES"
bucket_name = "speakerops-files"

# Queues — producer + consumer for transactional outbox drain (E7 / S-COMMS)
# Comms.Send inserts outbox_events and kicks JOBS_QUEUE; the consumer
# (and optional cron) call processCommsOutbox → sandbox/Resend provider.
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "speakerops-jobs"

[[queues.consumers]]
queue = "speakerops-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

# Cron backup drain so outbox rows are not stuck if a queue kick is missed.
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# Dogfood env (section 8.6 / S-CF + 11.9 S-DOGFOOD).
# Binding host: https://www.speakerops.org → Worker name speakerops-demo
# Usage: wrangler deploy --env dogfood
# Or:    scripts/deploy-dogfood.sh (preferred; writes BC10 + phase11 deploy.md)
# ---------------------------------------------------------------------------
[env.dogfood]
name = "speakerops-demo"
# Section 10.3 — DEMO captcha path for dogfood (S-CFP-SUBMIT). Names only (E10).
# DEMO_MODE forces test Turnstile site key + DEV_PASS under host allowlist.
# See docs/DEMO_HOST.md and docs/OPERATIONS.md.
# APP_VERSION overridden at deploy time with git short SHA (section 11.9 revision).
# Magic-link email: AUTH_EMAIL_PROVIDER=cloudflare + secrets APP_PUBLIC_BASE_URL,
# AUTH_LINK_ENCRYPTION_KEY, CLOUDFLARE_EMAIL_API_TOKEN (or EMAIL binding).
# MAGIC_LINK_ALLOWLIST: optional extra-allow (names only) — unset on dogfood; controlled
# policy admits existing users + provisioned members (programReentry) without it.
# CLOUDFLARE_ACCOUNT_ID is public account id (same as demo local toml) — not a secret token.
vars = { APP_VERSION = "0.1.0-demo", DEMO_MODE = "1", DEMO_ALLOWLIST_ENABLED = "1", DEMO_ALLOWLIST_HOSTS = "www.speakerops.org,speakerops.org,localhost,127.0.0.1", AUTH_EMAIL_PROVIDER = "cloudflare", EMAIL_PROVIDER = "cloudflare", AUTH_EMAIL_FROM = "SpeakerOps <noreply@speakerops.org>", EMAIL_FROM = "SpeakerOps <noreply@speakerops.org>", ROLE_SWITCHER_ENABLED = "1", CLOUDFLARE_ACCOUNT_ID = "29b7ea7447cbd053f101773302abccf8" }

# SPA static assets (Workers Assets) — Vite build output.
# run_worker_first=true (wrangler 3 boolean): Worker handles /api + /health, then
# default fetch falls through to env.ASSETS for SPA routes (see apps/api/src/index.ts).
[env.dogfood.assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.dogfood.d1_databases]]
binding = "DB"
database_name = "speakerops-demo"
# Resource id (not a secret). Override with SPEAKEROPS_D1_DATABASE_ID if needed.
database_id = "f01cd279-e505-4e4e-92b2-56ff2661b74a"
migrations_dir = "packages/db/migrations"

# Cloudflare Email Sending binding (domain must be enabled for speakerops.org).
[[env.dogfood.send_email]]
name = "EMAIL"

# R2 omitted on dogfood: account may not have R2 enabled; design store falls back
# to isolate-local blobs. Enable FILES later via dashboard + re-add binding.

[[env.dogfood.queues.producers]]
binding = "JOBS_QUEUE"
queue = "speakerops-demo-jobs"

[[env.dogfood.queues.consumers]]
queue = "speakerops-demo-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

# Minute backup drain for auth.magic_link + comms outbox if queue kick is missed.
[env.dogfood.triggers]
crons = ["* * * * *"]
