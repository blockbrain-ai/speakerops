# SpeakerOps API Worker — sections 1.2 (health) + 8.6 (dogfood deploy / S-CF)
# Binding names only. Secrets go in .dev.vars (gitignored) or `wrangler secret put`.
# Never commit tokens, API keys, or account credentials here (E10).
# Deploy: scripts/deploy-dogfood.sh · runbook: docs/OPERATIONS.md

name = "speakerops-api"
main = "apps/api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret public config (names + public version only)
# Production secrets (TURNSTILE_SECRET_KEY, RESEND_API_KEY, …) → wrangler secret put
[vars]
APP_VERSION = "0.1.0"
# Optional public Turnstile site key may be set at deploy time (not a private secret).
# TURNSTILE_SITE_KEY = ""  # set via dashboard / deploy pipeline — do not commit real keys

# D1 — binding name MUST be DB (AC: wrangler.toml lists D1 database binding name DB)
# database_id is a resource placeholder, not a secret; replace at deploy time via
# SPEAKEROPS_D1_DATABASE_ID (deploy-dogfood.sh) or local non-committed override.
# migrations_dir: same SQL as pnpm db:migrate (section 1.3 baseline + additive later).
[[d1_databases]]
binding = "DB"
database_name = "speakerops"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

# R2 — binding name FILES (logo / headshot / slides bytes; metadata in D1)
[[r2_buckets]]
binding = "FILES"
bucket_name = "speakerops-files"

# Queues — producer + consumer for transactional outbox drain (E7 / S-COMMS)
# Comms.Send inserts outbox_events and kicks JOBS_QUEUE; the consumer
# (and optional cron) call processCommsOutbox → sandbox/Resend provider.
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "speakerops-jobs"

[[queues.consumers]]
queue = "speakerops-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

# Cron backup drain so outbox rows are not stuck if a queue kick is missed.
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# Dogfood env (section 8.6 / S-CF) — same bindings; private workers.dev host.
# Usage: wrangler deploy --env dogfood
# Or:    scripts/deploy-dogfood.sh (preferred; writes BC10 evidence)
# ---------------------------------------------------------------------------
[env.dogfood]
name = "speakerops-api"
vars = { APP_VERSION = "0.1.0" }

[[env.dogfood.d1_databases]]
binding = "DB"
database_name = "speakerops"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "packages/db/migrations"

[[env.dogfood.r2_buckets]]
binding = "FILES"
bucket_name = "speakerops-files"

[[env.dogfood.queues.producers]]
binding = "JOBS_QUEUE"
queue = "speakerops-jobs"

[[env.dogfood.queues.consumers]]
queue = "speakerops-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

# ---------------------------------------------------------------------------
# Private demo host (allowlist + Resend magic links + SPA assets).
# Usage: wrangler deploy --env demo
#        scripts/deploy-demo.sh
# Resources are isolated from dogfood/prod names (speakerops-demo*).
# database_id placeholder — inject SPEAKEROPS_D1_DATABASE_ID or replace after create.
# ---------------------------------------------------------------------------
[env.demo]
name = "speakerops-demo"
vars = { APP_VERSION = "0.1.0-demo", DEMO_MODE = "1", DEMO_ALLOWLIST_ENABLED = "1", EMAIL_PROVIDER = "cloudflare", AUTH_EMAIL_PROVIDER = "cloudflare", EMAIL_FROM = "SpeakerOps <noreply@speakerops.org>", AUTH_EMAIL_FROM = "SpeakerOps <noreply@speakerops.org>", CLOUDFLARE_ACCOUNT_ID = "29b7ea7447cbd053f101773302abccf8" , TURNSTILE_SITE_KEY = "0x4AAAAAAEK0PMH6qLJQ09pU"}

# Cloudflare Email Sending binding (no Resend). Domain must be enabled in CF Email Service.
[[env.demo.send_email]]
name = "EMAIL"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "speakerops-demo"
database_id = "f01cd279-e505-4e4e-92b2-56ff2661b74a"
migrations_dir = "/Users/qualitycontrol/Documents/speakerops/packages/db/migrations"

# R2 disabled until account enables R2 (dashboard). File uploads optional for browse demo.
# [[env.demo.r2_buckets]]
# binding = "FILES"
# bucket_name = "speakerops-demo-files"

[[env.demo.queues.producers]]
binding = "JOBS_QUEUE"
queue = "speakerops-demo-jobs"

[[env.demo.queues.consumers]]
queue = "speakerops-demo-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

# Minute backup drain for auth/comms outbox (env-scoped cron).
[env.demo.triggers]
crons = ["* * * * *"]

# SPA static assets (same origin). Requires apps/web/dist built first.
# Wrangler 3.112 supports [assets]; run_worker_first needs newer wrangler — use Worker notFound for SPA if needed.
[env.demo.assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
