<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!--
      CSP defense-in-depth (section 8.3). Canonical policy lives in
      @speakerops/shared CONTENT_SECURITY_POLICY and is also sent as a
      response header by the API middleware and Vite server/preview.
      Note: frame-ancestors is header-only; meta cannot enforce it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#FCFBF9" />
    <title>SpeakerOps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <!--
      Self-hosted fonts (F1 · Sage & Honey lock) load via @font-face in
      fonts.css (font-display: swap). Manual <link rel=preload> was removed:
      the SPA paints text after the JS boot, so the preloaded faces were not
      applied "within a few seconds of load" and Chrome logged ~21 unused-
      preload warnings (auditor-confirmed: F1 preloads, not DnD/modulepreload).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
